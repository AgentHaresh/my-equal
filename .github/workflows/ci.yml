name: CI

# Every push and pull request: lint, type-check, unit tests, and a production build.
#
# The end-to-end suites (web/tests/*-test.mjs) are not run here. They need a running server and
# an OpenAI key, and they call the real model, so they are run by hand against a local or the
# live server with `npm run test:e2e`. See the README.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
